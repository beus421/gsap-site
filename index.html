<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wazzap</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar">
        <h1 class="logo">Area</h1>
        <div class="nav-link-container">
            <a href="" class="nav-links">Benefits</a>
            <a href="" class="nav-links">Specifications</a>
            <a href="" class="nav-links">How-to</a>
            <a href="" class="nav-links">Contact Us</a>
        </div>
        <button href="" class="primary-btn">
            <p>Learn More ↗</p>
        </button>
    </nav>
    <section class="hero-section">
        <h1 class="main-text">Browse everything.</h1>
        <div class="green-bg"></div>
        <!-- The Sleeve Container that hides the tablet -->
        <div class="sleeve-container">
            <!-- The main wrapper for the tablet -->
            <div class="tablet-wrapper">

                <!-- The Frame (your SVG) -->
                <img class="tablet-frame" src="./assets/tablet-screen.svg" alt="Tablet Frame">

                <!-- The Screen (where the content goes) -->
                <div class="tablet-screen">
                    <!-- You can put any image here, or even other HTML content -->
                    <img class="screen-content"
                        src="https://images.unsplash.com/photo-1707343843437-caacff5cfa74?q=80&w=2940&auto=format&fit=crop"
                        alt="Screen Content">
                </div>
            </div>
        </div>
    </section>
    <section class="section">

        <!-- You can put any image here, or even other HTML content -->
        <img class="screen-content"
            src="https://images.unsplash.com/photo-1707343843437-caacff5cfa74?q=80&w=2940&auto=format&fit=crop"
            alt="Screen Content">

    </section>
    <section class="section">

        <!-- You can put any image here, or even other HTML content -->
        <img class="screen-content"
            src="https://images.unsplash.com/photo-1707343843437-caacff5cfa74?q=80&w=2940&auto=format&fit=crop"
            alt="Screen Content">

    </section>

</body>
